<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>亗 𝙊𝙇𝘿 𝙓 亗 STORE</title>
    <!-- Telegram WebApp Script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: #0a0a0a;
            color: #ffffff;
            padding-bottom: 70px; /* Alt menyu üçün yer */
        }
        /* Yuxarı Hissə */
        .header {
            background: linear-gradient(135deg, #1a1a1a, #2a2a2a);
            padding: 20px;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.2);
        }
        .user-info { display: flex; align-items: center; gap: 15px; }
        .user-avatar { width: 50px; height: 50px; border-radius: 50%; background: #ff0000; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; }
        .user-name { font-size: 18px; font-weight: bold; }
        .user-id { font-size: 12px; color: #888; }
        .balances { display: flex; gap: 10px; margin-top: 15px; }
        .balance-card { flex: 1; background: #1a1a1a; padding: 15px; border-radius: 15px; border: 1px solid #333; text-align: center; }
        .balance-card .amount { font-size: 20px; font-weight: bold; color: #ff0000; }
        .balance-card .label { font-size: 12px; color: #888; margin-top: 5px; }

        /* Kateqoriyalar */
        .categories { padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .category-card {
            background: linear-gradient(135deg, #1a1a1a, #222);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            border: 1px solid #333;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .category-card:active { transform: scale(0.95); border-color: #ff0000; }
        .category-icon { font-size: 32px; margin-bottom: 10px; }
        .category-title { font-size: 14px; font-weight: bold; color: #fff; }

        /* Alt Menyu */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #111;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #333;
            z-index: 100;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #666;
            text-decoration: none;
            font-size: 12px;
            transition: color 0.3s;
        }
        .nav-item.active, .nav-item:active { color: #ff0000; }
        .nav-icon { font-size: 20px; margin-bottom: 3px; }

        /* Ümumi */
        .container { padding: 0 20px; }
        h2 { margin-top: 20px; margin-bottom: 10px; font-size: 18px; color: #ccc; }
        .product-card {
            background: #151515;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid #222;
        }
        .product-info { display: flex; flex-direction: column; gap: 5px; }
        .product-name { font-size: 16px; font-weight: bold; }
        .product-price { color: #ff0000; font-weight: bold; }
        .buy-btn {
            background: #ff0000;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }
        .buy-btn:active { background: #cc0000; }
    </style>
</head>
<body>

    <!-- Yuxarı Hissə (İstifadəçi məlumatları) -->
    <div class="header">
        <div class="user-info">
            <div class="user-avatar" id="userInitial">U</div>
            <div>
                <div class="user-name" id="userName">Yüklənir...</div>
                <div class="user-id" id="userId">ID: ...</div>
            </div>
        </div>
        <div class="balances">
            <div class="balance-card">
                <div class="amount" id="aznBalance">0.00 ₼</div>
                <div class="label">AZN Balans</div>
            </div>
            <div class="balance-card">
                <div class="amount" id="coinBalance">0 🪙</div>
                <div class="label">Coin Balans</div>
            </div>
        </div>
    </div>

    <!-- Kateqoriyalar -->
    <div class="container">
        <h2>Kateqoriyalar</h2>
        <div class="categories">
            <div class="category-card" onclick="alert('Market bölməsi tezliklə!')">
                <div class="category-icon">🛒</div>
                <div class="category-title">Market</div>
            </div>
            <div class="category-card" onclick="alert('PUBG UC bölməsi tezliklə!')">
                <div class="category-icon">🎮</div>
                <div class="category-title">PUBG UC</div>
            </div>
            <div class="category-card" onclick="alert('TikTok bölməsi tezliklə!')">
                <div class="category-icon">🪙</div>
                <div class="category-title">TikTok</div>
            </div>
            <div class="category-card" onclick="alert('SMM bölməsi tezliklə!')">
                <div class="category-icon">📱</div>
                <div class="category-title">SMM</div>
            </div>
        </div>

        <!-- Populyar Məhsullar (Nümunə) -->
        <h2>Populyar</h2>
        <div class="product-card">
            <div class="product-info">
                <div class="product-name">PUBG 660 UC</div>
                <div class="product-price">15.00 ₼</div>
            </div>
            <button class="buy-btn" onclick="alert('Sifariş funksiyası tezliklə!')">Al</button>
        </div>
        <div class="product-card">
            <div class="product-info">
                <div class="product-name">TikTok 350 Coin</div>
                <div class="product-price">5.00 ₼</div>
            </div>
            <button class="buy-btn" onclick="alert('Sifariş funksiyası tezliklə!')">Al</button>
        </div>
    </div>

    <!-- Alt Menyu -->
    <div class="bottom-nav">
        <a href="#" class="nav-item active">
            <span class="nav-icon">🏠</span>
            Ana Səhifə
        </a>
        <a href="#" class="nav-item" onclick="alert('Balans bölməsi tezliklə!')">
            <span class="nav-icon">💰</span>
            Balans
        </a>
        <a href="#" class="nav-item" onclick="alert('Sifarişlər bölməsi tezliklə!')">
            <span class="nav-icon">📦</span>
            Sifarişlər
        </a>
        <a href="#" class="nav-item" onclick="alert('Profil bölməsi tezliklə!')">
            <span class="nav-icon">👤</span>
            Profil
        </a>
    </div>

    <!-- JavaScript -->
    <script>
        // Telegram WebApp obyektini alırıq
        let tg = window.Telegram.WebApp;

        // Telegram tətbiqini tam ekran edirik
        tg.expand();

        // İstifadəçi məlumatlarını alırıq
        let user = tg.initDataUnsafe?.user;

        if (user) {
            document.getElementById('userName').innerText = user.first_name + (user.last_name ? ' ' + user.last_name : '');
            document.getElementById('userId').innerText = 'ID: ' + user.id;
            document.getElementById('userInitial').innerText = user.first_name.charAt(0).toUpperCase();
            
            // Burada real balansı götürmək üçün botun API-sinə sorğu göndərəcəyik
            // Hələlik nümunə üçün 0 yazırıq
            document.getElementById('aznBalance').innerText = '0.00 ₼';
            document.getElementById('coinBalance').innerText = '0 🪙';
        } else {
            // Əgər botdan kənar açılıbsa
            document.getElementById('userName').innerText = 'Qonaq';
        }

        // Telegram Rənglərini uyğunlaşdırırıq
        tg.setHeaderColor('#0a0a0a');
        tg.setBackgroundColor('#0a0a0a');
    </script>
</body>
</html>
